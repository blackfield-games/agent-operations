[workspace]
resolver = "2"
members = ["proto"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
arena-proto = { path = "proto" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
