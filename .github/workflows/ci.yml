name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh:
    name: mesh (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings

  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vvv

  agents:
    name: agents (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      # Minimal install: what the runtime + tests actually import, plus ruff for
      # the lint gate. The heavy infra deps in pyproject (ray, usd-core,
      # temporalio) aren't exercised by the test suite, so we skip them to keep
      # CI fast.
      - run: pip install langgraph pydantic anyio pytest pytest-asyncio ruff
      - run: ruff check .
      - run: python -m pytest -q
