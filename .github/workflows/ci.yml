name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh:
    name: mesh (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesh
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings

  arena:
    name: arena (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arena
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arena
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings

  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1
      # Lint gate (mirrors the agents ruff gate): fail fast on style drift
      # before the slower build/test. Uses the [fmt] config in foundry.toml.
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vvv
      # viem ABI drift gate (mirrors forge fmt --check): regenerate the
      # committed ABIs and fail if they differ from what's checked in. `jq -S`
      # canonicalizes key order so the gate tracks real ABI changes, not
      # formatter cosmetics. jq is preinstalled on ubuntu-latest.
      - run: |
          for c in ComputeMeter RenderReceipts RegionAuthority ArtifactTemplate AgentRegistry MatchSettlement; do
            forge inspect "$c" abi --json | jq -S . > "abi/$c.json"
          done
          git diff --exit-code abi/

  agents:
    name: agents (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      # Minimal install: what the runtime + tests actually import, plus ruff for
      # the lint gate. The heavy infra deps in pyproject (ray, usd-core,
      # temporalio) aren't exercised by the test suite, so we skip them to keep
      # CI fast.
      - run: pip install langgraph pydantic anyio pytest pytest-asyncio ruff
      - run: ruff check .
      - run: python -m pytest -q
